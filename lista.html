<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos</title><style>body{font-family:Arial,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;color:#20332b;background:#f7faf8}a{color:#21623d}h1{color:#205c39}table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;border:1px solid #cbd8cf;text-align:left}input,select,button{padding:10px;margin:6px 0;border:1px solid #a0b5a8;border-radius:4px}button{background:#205c39;color:white;cursor:pointer}label{display:block}form.cadastro{max-width:440px}form.cadastro input,form.cadastro select{width:100%;box-sizing:border-box}.erro{color:#a52020}.mensagem{color:#205c39}</style></head><body>
<h1>Cadastro de produtos</h1><p><a th:href="@{/produtos/novo}">Cadastrar produto</a></p><p class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></p>
<form th:action="@{/produtos}" method="get"><label for="busca">Nome</label><input id="busca" name="busca" th:value="${busca}" placeholder="Buscar por nome"><label for="categoria">Categoria</label><select id="categoria" name="categoria"><option value="">Todas</option><option th:each="c : ${categorias}" th:value="${c}" th:text="${c}" th:selected="${c == categoria}"></option></select><button type="submit">Filtrar</button> <a th:href="@{/produtos}">Limpar filtros</a></form>
<table><thead><tr><th>Nome</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead><tbody><tr th:each="p : ${produtos}"><td th:text="${p.nome}"></td><td th:text="${p.categoria}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(p.preco,1,'POINT',2,'COMMA')}"></td><td th:text="${p.estoque}"></td><td><form th:action="@{/produtos/{id}/remover(id=${p.id})}" method="post"><button type="submit" th:aria-label="${'Remover ' + p.nome}">Remover</button></form></td></tr><tr th:if="${#lists.isEmpty(produtos)}"><td colspan="5">Nenhum produto encontrado.</td></tr></tbody></table>
<p>Total de produtos exibidos: <strong th:text="${#lists.size(produtos)}"></strong></p></body></html>
