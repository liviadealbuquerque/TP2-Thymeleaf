<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar produto</title><style>body{font-family:Arial,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;color:#20332b;background:#f7faf8}a{color:#21623d}h1{color:#205c39}table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;border:1px solid #cbd8cf;text-align:left}input,select,button{padding:10px;margin:6px 0;border:1px solid #a0b5a8;border-radius:4px}button{background:#205c39;color:white;cursor:pointer}label{display:block}form.cadastro{max-width:440px}form.cadastro input,form.cadastro select{width:100%;box-sizing:border-box}.erro{color:#a52020}.mensagem{color:#205c39}</style></head><body><h1>Novo produto</h1><p class="erro" role="alert" th:if="${erro}" th:text="${erro}"></p>
<form class="cadastro" th:action="@{/produtos}" th:object="${produto}" method="post"><label for="nome">Nome</label><input id="nome" th:field="*{nome}" required maxlength="255"><label for="categoria">Categoria</label><select id="categoria" th:field="*{categoria}" required><option value="">Selecione</option><option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option></select><label for="preco">Preço (R$)</label><input id="preco" type="number" min="0" max="9999999999.99" step="0.01" th:field="*{preco}" required><label for="estoque">Estoque</label><input id="estoque" type="number" min="0" step="1" th:field="*{estoque}" required><button type="submit">Salvar</button> <a th:href="@{/produtos}">Voltar</a></form></body></html>
